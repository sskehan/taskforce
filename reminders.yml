name: TaskForce reminders
on:
  schedule:
    - cron: '7 * * * *'   # every hour at :07 (GitHub can run a few minutes late)
  workflow_dispatch:
    inputs:
      test:
        description: 'Send a test notification to every phone'
        type: boolean
        default: false
jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --omit=dev --no-audit --no-fund
        working-directory: reminders
      - run: node reminders/send.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TEST: ${{ github.event.inputs.test || 'false' }}
