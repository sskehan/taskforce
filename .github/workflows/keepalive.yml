yaml
name: Keep reminders switched on
on:
  schedule:
    - cron: '23 3 1 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > keepalive.txt
          git config user.name "TaskForce bot"
          git config user.email "actions@users.noreply.github.com"
          git add keepalive.txt
          git commit -m "Keep reminders running" || echo "nothing to commit"
          git push
